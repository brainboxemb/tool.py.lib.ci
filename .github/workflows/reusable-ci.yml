name: Reusable Python library CI

on:
  workflow_call:
    outputs:
      change_scope:
        description: Change scope selected for package validation.
        value: ${{ jobs.test.outputs.change_scope }}
    inputs:
      source_sha:
        description: Exact library source commit; defaults to the triggering source commit.
        required: false
        type: string
        default: ""
      python_version:
        description: Python version used to build and test the library repository.
        required: false
        type: string
        default: "3.12"
      test_command:
        description: Library test command. Supports {python} and {repo}; empty uses unittest discovery.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: py-lib-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      change_scope: ${{ steps.scope.outputs.scope }}
    env:
      PY_LIB_CI_SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

    steps:
      - name: Checkout library source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PY_LIB_CI_SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout called tool revision
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tool-py-lib-ci
          fetch-depth: 1

      - name: Classify repository change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_FORCED: ${{ github.event.forced && 'true' || 'false' }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          scope="full"
          reason="full package validation required"

          base_sha="$(python3 .tool-py-lib-ci/scripts/change_scope.py base \
            --event "$EVENT_NAME" \
            --source-sha-input "$SOURCE_SHA_INPUT" \
            --pull-base-sha "$PULL_BASE_SHA" \
            --push-before-sha "$PUSH_BEFORE_SHA" \
            --push-forced "$PUSH_FORCED")"

          if [[ -n "$base_sha" ]]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            git diff --name-only -z --no-renames "$base_sha" "$PY_LIB_CI_SOURCE_SHA" \
              > "$RUNNER_TEMP/py-lib-ci-changed-paths"
            scope="$(python3 .tool-py-lib-ci/scripts/change_scope.py classify \
              "$RUNNER_TEMP/py-lib-ci-changed-paths")"
            if [[ "$scope" == "docs-only" ]]; then
              reason="documentation-only change under docs/"
            fi
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Skip package validation for documentation-only change
        if: steps.scope.outputs.scope == 'docs-only'
        run: |
          echo "Python library CI skipped build/install/test: ${{ steps.scope.outputs.reason }}"

      - name: Set up Python
        if: steps.scope.outputs.scope != 'docs-only'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build, install and test library wheel
        if: steps.scope.outputs.scope != 'docs-only'
        run: |
          python .tool-py-lib-ci/scripts/library_ci.py \
            --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/py-lib-ci" \
            --test-command "${{ inputs.test_command }}"
